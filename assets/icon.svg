<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#qrGrad)" />
  
  <!-- Subtle Inner Glass Effect -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Center Card -->
  <rect x="76" y="76" width="360" height="360" rx="48" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Stylized QR Elements -->
  <!-- Top Left Marker -->
  <rect x="120" y="120" width="90" height="90" rx="22" fill="#1e1b4b" />
  <rect x="138" y="138" width="54" height="54" rx="14" fill="#ffffff" />
  <rect x="150" y="150" width="30" height="30" rx="8" fill="#4f46e5" />
  
  <!-- Top Right Marker -->
  <rect x="302" y="120" width="90" height="90" rx="22" fill="#1e1b4b" />
  <rect x="320" y="138" width="54" height="54" rx="14" fill="#ffffff" />
  <rect x="332" y="150" width="30" height="30" rx="8" fill="#7c3aed" />
  
  <!-- Bottom Left Marker -->
  <rect x="120" y="302" width="90" height="90" rx="22" fill="#1e1b4b" />
  <rect x="138" y="320" width="54" height="54" rx="14" fill="#ffffff" />
  <rect x="150" y="332" width="30" height="30" rx="8" fill="#06b6d4" />

  <!-- Custom QR Data Dots -->
  <circle cx="256" cy="150" r="15" fill="#4f46e5" />
  <circle cx="256" cy="210" r="15" fill="#7c3aed" />
  <circle cx="256" cy="270" r="15" fill="#1e1b4b" />
  <circle cx="256" cy="330" r="15" fill="#06b6d4" />
  
  <circle cx="165" cy="256" r="15" fill="#1e1b4b" />
  <circle cx="347" cy="256" r="15" fill="#4f46e5" />

  <rect x="302" y="302" width="40" height="40" rx="12" fill="#7c3aed" />
  <rect x="352" y="302" width="40" height="40" rx="12" fill="#4f46e5" />
  <rect x="302" y="352" width="40" height="40" rx="12" fill="#06b6d4" />
  <circle cx="372" cy="372" r="20" fill="#1e1b4b" />
</svg>
